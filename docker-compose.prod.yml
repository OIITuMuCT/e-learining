services:
  web:
    # На сервере код вшит внутрь образа, volumes для разработки удалены
    volumes:
      - static_files:/code/staticfiles
      - media_files:/code/media
     # Меняем запуск uWSGI с сокета на HTTP-порт 8080:
    command: [ "./wait-for-it.sh", "db:5432", "--",
               "uwsgi", "--http", "0.0.0.0:8080", "--ini", "/code/config/uwsgi/uwsgi.ini" ]

  nginx:
    image: nginx:1.25.5
    restart: always
    volumes:
      - ./config/nginx:/etc/nginx/templates
      - ./educa/ssl:/etc/nginx/ssl:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot
      - static_files:/code/staticfiles:ro
      - media_files:/code/media:ro
      - uwsgi_socket:/code/educa:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - web
      - daphne

volumes:
  static_files:
  media_files:
